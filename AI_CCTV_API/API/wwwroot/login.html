<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI CCTV — Sign In</title>
<style>
  :root{ --ink:#1f2430; --muted:#8a93a6; --blue:#2f6bff; --line:#e7ebf3; --red:#f0455f; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh;
        display:grid; place-items:center; color:var(--ink);
        background:linear-gradient(135deg,#eef2fb 0%,#dde6fb 100%); }
  .card{ background:#fff; width:380px; max-width:92vw; border-radius:20px; padding:36px 32px;
         box-shadow:0 20px 60px rgba(31,36,48,.12); }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; margin-bottom:6px; }
  .brand .logo{ width:34px; height:34px; border-radius:10px; background:var(--blue); color:#fff; display:grid; place-items:center; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:26px; }
  label{ font-size:13px; font-weight:600; color:var(--muted); display:block; margin:14px 2px 6px; }
  input{ width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px; font-size:14px; outline:none; }
  input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,107,255,.12); }
  button{ width:100%; margin-top:24px; padding:13px; border:none; border-radius:12px; background:var(--blue);
          color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button:hover{ background:#245ae0; }
  button:disabled{ opacity:.6; cursor:default; }
  .msg{ margin-top:16px; font-size:13px; font-weight:600; text-align:center; min-height:18px; color:var(--red); }
  .foot{ margin-top:22px; text-align:center; font-size:14px; color:var(--muted); }
  .foot a{ color:var(--blue); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand"><span class="logo">●</span> AI CCTV</div>
    <div class="sub">Sign in to your surveillance dashboard</div>

    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username" required />

    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />

    <button id="btn" type="submit">Sign In</button>
    <div class="msg" id="msg"></div>

    <div class="foot">Don't have an account? <a href="signup.html">Create one</a></div>
  </form>

<script>
  // Already logged in? go straight to the dashboard.
  if (localStorage.getItem("cctv_auth")) location.replace("dashboard.html");

  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = ""; btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok) {
        localStorage.setItem("cctv_auth", JSON.stringify(data));
        location.replace("dashboard.html");
      } else {
        msg.textContent = data.message || "Sign in failed.";
      }
    } catch {
      msg.textContent = "Cannot reach the server. Is the API running?";
    } finally {
      btn.disabled = false; btn.textContent = "Sign In";
    }
  });
</script>
</body>
</html>
