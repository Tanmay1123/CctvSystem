<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI CCTV — Alerts</title>
<link rel="stylesheet" href="css/app.css" />
<style>
  .filters { display:flex; gap:8px; margin: 0 0 18px; }
  .chip { border:1px solid var(--line); background:#fff; color:var(--muted); font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .chip.on { background:var(--blue); color:#fff; border-color:var(--blue); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Alerts</h1><div class="sub" id="sub">All detection alerts</div></div>
      <button class="btn-del" onclick="clearAll()">🗑 Clear All</button>
    </div>

    <div class="filters" id="filters">
      <span class="chip on" data-f="all" onclick="setFilter('all')">All</span>
      <span class="chip" data-f="intrusion" onclick="setFilter('intrusion')">Intrusion</span>
      <span class="chip" data-f="sleeping" onclick="setFilter('sleeping')">Sleeping</span>
      <span class="chip" data-f="open" onclick="setFilter('open')">Open</span>
      <span class="chip" data-f="closed" onclick="setFilter('closed')">Closed</span>
    </div>

    <table class="tbl">
      <thead><tr><th>Preview</th><th>Type</th><th>Camera</th><th>Time</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
    </table>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  mountSidebar("alerts");
  let alerts = [], filter = "all";

  function setFilter(f){ filter=f; document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.f===f)); render(); }

  function visible(){
    return alerts.filter(a=>{
      if(filter==="all") return true;
      if(filter==="open") return a.status==="Open";
      if(filter==="closed") return a.status==="Closed";
      return typeKey(a.alertType)===filter;
    });
  }

  function render(){
    const rows = document.getElementById("rows");
    const list = visible();
    document.getElementById("sub").textContent = `${alerts.length} total · ${alerts.filter(a=>a.status==="Open").length} open`;
    if(!list.length){ rows.innerHTML = `<tr><td colspan="6" class="empty">No alerts.</td></tr>`; return; }
    rows.innerHTML = list.map(a=>{
      const k = typeKey(a.alertType);
      const prev = isVideo(a)
        ? `<a href="${mediaUrl(a)}" target="_blank"><img class="thumb" src="${posterUrl(a)}" onerror="this.style.opacity=.2"/></a>`
        : (mediaUrl(a) ? `<a href="${mediaUrl(a)}" target="_blank"><img class="thumb" src="${mediaUrl(a)}" onerror="this.style.opacity=.2"/></a>` : "—");
      return `<tr>
        <td>${prev}</td>
        <td><span class="badge ${k}">${a.alertType}${isVideo(a)?" ▶":""}</span></td>
        <td>${a.cameraName||"—"}</td>
        <td>${fmt(a.alertTime||a.createdDate)}</td>
        <td><span class="status ${a.status}">${a.status}</span></td>
        <td style="text-align:right; white-space:nowrap">
          <button class="btn" ${a.status==="Closed"?"disabled":""} onclick="closeA(${a.alertId})">${a.status==="Closed"?"Resolved":"Close"}</button>
          <button class="btn-del" onclick="delA(${a.alertId})">🗑</button>
        </td></tr>`;
    }).join("");
  }

  async function load(){ alerts = await getAlerts(); render(); }
  async function closeA(id){
    const r = await fetch(`${API_BASE}/api/alerts/${id}/close`, {method:"PUT"});
    if(r.ok){ const a=alerts.find(x=>x.alertId===id); if(a)a.status="Closed"; render(); toast("Alert #"+id+" closed","green"); }
  }
  async function delA(id){
    if(!confirmBox(`Delete alert #${id} and its media?`)) return;
    const r = await fetch(`${API_BASE}/api/alerts/${id}`, {method:"DELETE"});
    if(r.ok){ alerts=alerts.filter(x=>x.alertId!==id); render(); toast("Alert #"+id+" deleted","amber"); }
  }
  async function clearAll(){
    if(!alerts.length){ toast("Nothing to clear","blue"); return; }
    if(!confirmBox(`Delete ALL ${alerts.length} alerts and their media?`)) return;
    const r = await fetch(`${API_BASE}/api/alerts`, {method:"DELETE"});
    if(r.ok){ alerts=[]; render(); toast("All alerts cleared","amber"); }
  }
  function confirmBox(m){ return window.confirm(m); }

  load();
  setInterval(load, 8000);
</script>
</body>
</html>
